{% comment %}
Shows the picked request type's description (TicketType.description, written
by CE) under the Request Type select. Include after {{ form|crispy }} on a page
whose form is a SupportTicketForm.
{% endcomment %}
{{ form.type_descriptions|json_script:"ticket_type_descriptions" }}
<div id="ticket_type_description" class="alert bg-gray-100 mb-3" style="display:none"></div>
<script>
    (function () {
        var descriptions = JSON.parse(document.getElementById('ticket_type_descriptions').textContent);
        var select = document.getElementById('id_ticket_type');
        var panel = document.getElementById('ticket_type_description');
        if (!select || !panel) { return; }
        var group = select.closest('.form-group') || select.parentNode;
        group.parentNode.insertBefore(panel, group.nextSibling);

        // The description is CE-written HTML. Rebuild it from an allowlist
        // (parsed in an inert document, so nothing in it runs): text, basic
        // formatting and links to http(s) or same-site paths only.
        var ALLOWED = {P: 1, BR: 1, STRONG: 1, B: 1, EM: 1, I: 1, U: 1, UL: 1, OL: 1,
                       LI: 1, A: 1, H4: 1, H5: 1, H6: 1, SPAN: 1, DIV: 1};
        function safeHref(href) {
            try {
                var url = new URL(href, window.location.href);
                return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : null;
            } catch (e) { return null; }
        }
        function copy(from, to) {
            from.childNodes.forEach(function (node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    to.appendChild(document.createTextNode(node.textContent));
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    if (!ALLOWED[node.tagName]) { copy(node, to); return; }
                    var el = document.createElement(node.tagName);
                    if (node.tagName === 'A') {
                        var href = safeHref(node.getAttribute('href') || '');
                        if (href) {
                            el.setAttribute('href', href);
                            el.setAttribute('target', '_blank');
                            el.setAttribute('rel', 'noopener');
                        }
                    }
                    copy(node, el);
                    to.appendChild(el);
                }
            });
        }

        function show() {
            var text = descriptions[select.value] || '';
            panel.textContent = '';
            if (text) {
                var parsed = new DOMParser().parseFromString(text, 'text/html');
                copy(parsed.body, panel);
            }
            panel.style.display = text ? '' : 'none';
        }
        select.addEventListener('change', show);
        show();   // a re-rendered form keeps its pick
    })();
</script>
