[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myce-support-ticket"
version = "1.0.2"
description = "MyCE - Support Tickets"
requires-python = ">=3.8"
# Declared here, not only in setup.cfg: this [project] table has no
# `dynamic = ["dependencies"]`, so setuptools discards setup.cfg install_requires.
# myce_cis>=0.1.7a: campus-scoped school pickers (cis.highschool_scope).
dependencies = [
    "Django>=3.2",
    "myce_cis>=0.1.7a",
]
